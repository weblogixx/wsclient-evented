<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>wsclient-evented Demo</title>
    <script src="wsclientevented.js"></script>
  </head>
  <body>
    <p>Open the browser console to see what's happening.</p>
    <script>
    var ws = new WsClientEvented('ws://localhost:9999', null, {
      debug: true,
      timeoutInterval: 1000,
      onBeforeWsOpen: function() {
        console.log('onBeforeWsOpen called!');
      },
      onWsTimeout: function() {
        console.log('onWsTimeout called!');
      }
    });

    ws.addListener('test-response', function(event, message) {
        console.log('Received test response:', message);
      })
      .send('test', {
        ping: 'pong'
      });
    </script>
  </body>
</html>
